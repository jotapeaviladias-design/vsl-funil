<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VSL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0D0D0D;
      font-family: 'Montserrat', 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .cta-button {
      display: inline-block;
      margin-top: 40px;
      background-color: #C0FF00;
      color: #000000;
      font-family: inherit;
      font-weight: 700;
      font-size: 1.25rem;
      text-decoration: none;
      text-align: center;
      padding: 20px 50px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(192, 255, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="video-wrapper">
      <iframe
        src="https://www.youtube.com/embed/KM89Ljj-Of8?autoplay=1&mute=1&loop=1&playlist=KM89Ljj-Of8&playsinline=1"
        title="VSL"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <a class="cta-button" href="LINK_CHECKOUT_DIGISTORE">
      QUERO GARANTIR AGORA
    </a>
  </div>
</body>
</html>
